openapi: 3.1.0
info:
  title: King Mongkut Social API
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
paths:
  /auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        '201': { description: Registered }
  /auth/login:
    post:
      summary: Login
      responses:
        '200': { description: Logged in }
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      responses:
        '200': { description: Refreshed }
  /auth/logout:
    post:
      summary: Revoke current refresh session
      responses:
        '204': { description: Logged out }
  /auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
  /posts:
    get:
      summary: List published posts
      responses:
        '200': { description: Published posts }
    post:
      summary: Create post
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /posts/mine:
    get:
      summary: List current user's posts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User posts }
  /posts/{id}:
    get:
      summary: Get a published post (or own private post if authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Post }
    patch:
      summary: Update own post (admin may update any)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete own post (admin may delete any)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
