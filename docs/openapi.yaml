            asset:
              type: object
              required: [url, mimeType, size]
              properties:
                url: { type: string, description: Public absolute path under /api/v1/users/uploads/. }
                mimeType: { type: string, enum: [image/jpeg, image/png, image/gif, image/webp, image/avif] }
                size: { type: integer, minimum: 1 }
    User:
      type: object
